global:
  scrape_interval: 3s
scrape_configs:
  - job_name: 'bot'
    static_configs:
      - targets: ['host.docker.internal:8050']
  - job_name: 'backend'
    static_configs:
      - targets: ['host.docker.internal:8000']
  - job_name: 'celery'
    static_configs:
      - targets: ['host.docker.internal:9808']

